# .github/workflows/merge-steward.yml — per-repo caller for the Merge Steward.
# Source of truth: frankxai/agentic-ops-hub · docs/MERGE-STEWARD.md
# Copy as-is; set the `workflows:` list under workflow_run to this repo's CI
# workflow name(s). Adding or editing this file is always human tier.
#
# Repo settings this relies on (Frank sets them; see docs/MERGE-STEWARD-ROLLOUT.md):
#   variables  MERGE_STEWARD_MODE = shadow | live   (unset = shadow)
#              MERGE_STEWARD      = off             (kill switch)
#   secrets    ANTHROPIC_API_KEY, STEWARD_APP_ID, STEWARD_PRIVATE_KEY, optional OPENAI_API_KEY
#              (repeat under Settings -> Secrets -> Dependabot for Dependabot PRs)
name: Merge Steward

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: "17 6 * * *" # daily digest, 06:17 UTC
  workflow_run:
    workflows: ["CI"] # <- this repo's required CI workflow name(s)
    types: [completed]
    branches: [main]

concurrency:
  group: merge-steward-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Ceiling for the reusable workflow; each job there asks for less.
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  steward:
    # Only steward labels re-run the pipeline; other label churn costs nothing.
    if: >
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      startsWith(github.event.label.name, 'steward:')
    # Pin to a reviewed commit SHA of agentic-ops-hub, and set steward_ref to the same SHA.
    uses: frankxai/agentic-ops-hub/.github/workflows/merge-steward.yml@main
    with:
      mode: ${{ vars.MERGE_STEWARD_MODE }}
      kill_switch: ${{ vars.MERGE_STEWARD }}
      steward_ref: main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STEWARD_APP_ID: ${{ secrets.STEWARD_APP_ID }}
      STEWARD_PRIVATE_KEY: ${{ secrets.STEWARD_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
