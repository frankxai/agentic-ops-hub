# Fleet liveness watch — the off-machine dead-man's switch.
#
# Every other liveness signal (topology-health-pulse, host-watchdog, the 6h
# Telegram pulse) runs ON C940, so an offline C940 silences its own alarms
# and event-driven CI simply stops running when pushes stop. This workflow
# runs on GitHub's schedule instead: a dark machine, a stale ops ledger, or
# an expired queue item CAUSES an alert rather than suppressing one.
#
# Durable-output-sink law: findings land as a GitHub issue (created once,
# then commented when the finding fingerprint changes), never report-only
# into a run log. Identical consecutive failures do not re-comment.
name: Fleet watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fleet liveness check
        env:
          GH_TOKEN: ${{ github.token }}
          FLEET_WATCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/fleet_watch.py --notify
