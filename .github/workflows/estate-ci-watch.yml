# Estate CI watch — no default branch stays red unnoticed.
#
# Lives in this PUBLIC repo on purpose: an exhausted Actions budget blocks
# private-repo CI but not public runs, so this watch keeps firing exactly when
# the rest of the estate goes quiet. See scripts/estate_ci_watch.py.
#
# Durable-output-sink law: findings land as one GitHub issue (created once,
# then commented per firing), never report-only into a run log.
name: Estate CI watch

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  estate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Estate default-branch CI check
        id: watch
        continue-on-error: true
        env:
          ESTATE_READ_TOKEN: ${{ secrets.ESTATE_READ_TOKEN }}
        run: |
          set -o pipefail
          python scripts/estate_ci_watch.py 2>&1 | tee watch.out

      - name: File findings as a durable issue
        if: steps.watch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          {
            echo "Scheduled estate-ci-watch run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            cat watch.out
            echo '```'
          } > issue-body.md
          NUM=$(gh issue list --search "Estate CI watch in:title" --state open --json number --jq '.[0].number' || true)
          if [ -z "$NUM" ]; then
            gh issue create \
              --title "Estate CI watch: red default branches" \
              --body-file issue-body.md
          else
            gh issue comment "$NUM" --body-file issue-body.md
          fi

      - name: Propagate result
        if: steps.watch.outcome == 'failure'
        run: exit 1
