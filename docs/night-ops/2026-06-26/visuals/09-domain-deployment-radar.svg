<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840"><rect width="1400" height="840" fill="#101214"/><text x="60" y="80" fill="#f4f1ea" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">Domain &amp; Deployment Radar</text><text x="60" y="118" fill="#aeb7bd" font-family="Inter,Arial,sans-serif" font-size="18">2026-06-26 read-only scan - 27 surfaces - 17 red - 9 yellow - 1 green</text><rect x="60" y="165" width="390" height="180" rx="8" fill="#2a1517" stroke="#e25555" stroke-width="2"/><text x="88" y="210" fill="#ffb3b3" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">Red Lane</text><text x="88" y="250" fill="#f4f1ea" font-family="Inter,Arial,sans-serif" font-size="18">Blocked/error deploy or root health failure.</text><text x="88" y="290" fill="#d8d5cf" font-family="Inter,Arial,sans-serif" font-size="15">arcanea.ai: latest Vercel deployment BLOCKED | aiarchitectacademy.com: root not healthy | arcanea.io: latest Vercel deployment BLOCKED | arcanea.dev: root not healthy | arcanea.com: root not healthy</text><rect x="505" y="165" width="390" height="180" rx="8" fill="#2b2411" stroke="#d8a531" stroke-width="2"/><text x="533" y="210" fill="#ffd27a" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">Yellow Lane</text><text x="533" y="250" fill="#f4f1ea" font-family="Inter,Arial,sans-serif" font-size="18">Mapping, dirty state, or proof needed.</text><text x="533" y="290" fill="#d8d5cf" font-family="Inter,Arial,sans-serif" font-size="15">frankx.ai | gencreator.ai | starlightintelligence.org | animelegends.ai | vibeclubs.ai | agenticincome.ai | disruptivepassiveincome.com | akamoto.io</text><rect x="950" y="165" width="390" height="180" rx="8" fill="#13251b" stroke="#57bd78" stroke-width="2"/><text x="978" y="210" fill="#a4f0bd" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">Green Lane</text><text x="978" y="250" fill="#f4f1ea" font-family="Inter,Arial,sans-serif" font-size="18">Reachable with no current blocker signal.</text><text x="978" y="290" fill="#d8d5cf" font-family="Inter,Arial,sans-serif" font-size="15">1 surfaces</text><line x1="60" y1="400" x2="1340" y2="400" stroke="#30363a"/><text x="60" y="455" fill="#f4f1ea" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Decision Queue</text><text x="60" y="500" fill="#d8d5cf" font-family="Inter,Arial,sans-serif" font-size="18">1. Arcanea: triage BLOCKED/ERROR preview deployments before production claims.</text><text x="60" y="535" fill="#d8d5cf" font-family="Inter,Arial,sans-serif" font-size="18">2. Registry: backfill provider/project mappings for aliases and backlog domains.</text><text x="60" y="570" fill="#d8d5cf" font-family="Inter,Arial,sans-serif" font-size="18">3. Revenue surfaces: verify affiliate disclosure and checkout/go-link proof before promotion language.</text><text x="60" y="640" fill="#aeb7bd" font-family="Inter,Arial,sans-serif" font-size="16">Approval gate: no DNS, domain, deploy, promote, merge, spend, gateway, or external-send action.</text></svg>
