<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <rect width="1800" height="1200" fill="#05060A"/>
  <rect x="56" y="56" width="1688" height="1088" rx="34" fill="#0A0C14" stroke="#1A1F2E" stroke-width="2"/>
  <text x="96" y="134" fill="#F1F3F9" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">Social Approval Backlog</text>
  <text x="98" y="184" fill="#8A90A8" font-family="Inter, Arial, sans-serif" font-size="25">The content system works. Now the approval queue needs decisions.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(96,250)">
      <rect width="760" height="214" rx="22" fill="#101521" stroke="#72E6AC" stroke-width="2"/>
      <text x="28" y="52" fill="#72E6AC" font-size="30" font-weight="800">1. Revised Agentic Coding OS</text>
      <text x="28" y="98" fill="#F1F3F9" font-size="24">Approval-ready draft, QA 27/30</text>
      <text x="28" y="138" fill="#8A90A8" font-size="21">Best first decision: approve, edit, revise, or hold.</text>
      <text x="28" y="178" fill="#F6C86B" font-size="22">Recommendation: decide first</text>
    </g>
    <g transform="translate(944,250)">
      <rect width="760" height="214" rx="22" fill="#101521" stroke="#F6C86B" stroke-width="2"/>
      <text x="28" y="52" fill="#F6C86B" font-size="30" font-weight="800">2. Original Agentic Coding OS</text>
      <text x="28" y="98" fill="#F1F3F9" font-size="24">Superseded draft, QA 26/30</text>
      <text x="28" y="138" fill="#8A90A8" font-size="21">Revised version is more accurate and better framed.</text>
      <text x="28" y="178" fill="#F6C86B" font-size="22">Recommendation: hold or archive</text>
    </g>

    <g transform="translate(96,528)">
      <rect width="760" height="214" rx="22" fill="#101521" stroke="#F6C86B" stroke-width="2"/>
      <text x="28" y="52" fill="#F6C86B" font-size="30" font-weight="800">3. Agentic Portfolio OS</text>
      <text x="28" y="98" fill="#F1F3F9" font-size="24">Draft candidate, older frame</text>
      <text x="28" y="138" fill="#8A90A8" font-size="21">Slack-first and negative framing are now weaker than doctrine.</text>
      <text x="28" y="178" fill="#F6C86B" font-size="22">Recommendation: revise or hold</text>
    </g>
    <g transform="translate(944,528)">
      <rect width="760" height="214" rx="22" fill="#101521" stroke="#6EA8FE" stroke-width="2"/>
      <text x="28" y="52" fill="#6EA8FE" font-size="30" font-weight="800">4. Founder Operating Room</text>
      <text x="28" y="98" fill="#F1F3F9" font-size="24">Workroom proof, QA 28/30</text>
      <text x="28" y="138" fill="#8A90A8" font-size="21">Strong positive frame: calmer company, smarter system.</text>
      <text x="28" y="178" fill="#F6C86B" font-size="22">Recommendation: promote only as replacement</text>
    </g>

    <g transform="translate(96,824)">
      <rect width="1608" height="168" rx="24" fill="#111827" stroke="#FF7A90" stroke-width="2"/>
      <text x="30" y="58" fill="#FF7A90" font-size="31" font-weight="800">Queue Rule</text>
      <text x="30" y="106" fill="#F1F3F9" font-size="25">Do not add more approval candidates until one is approved, revised, held, archived, or replaced.</text>
    </g>
    <g transform="translate(96,1038)">
      <text fill="#8A90A8" font-size="23">Decision language: APPROVE | APPROVE WITH EDITS | REVISE | HOLD | REPLACE</text>
    </g>
  </g>
</svg>
