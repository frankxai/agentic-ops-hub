<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#05060A"/>
  <rect x="56" y="56" width="1488" height="1088" rx="32" fill="#0A0C14" stroke="#1A1F2E" stroke-width="2"/>
  <text x="96" y="136" fill="#F1F3F9" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800">Tonight Action Board</text>
  <text x="98" y="184" fill="#8A90A8" font-family="Inter, Arial, sans-serif" font-size="25">Make the system smarter without increasing public, production, or approval risk.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(96,250)">
      <rect width="680" height="330" rx="24" fill="#101521" stroke="#72E6AC" stroke-width="2"/>
      <text x="32" y="58" fill="#72E6AC" font-size="34" font-weight="800">Do Now</text>
      <text x="32" y="116" fill="#F1F3F9" font-size="25">1. Post night ops proof to #execution-room.</text>
      <text x="32" y="162" fill="#F1F3F9" font-size="25">2. Post Founder Operating Room to #social-carousels.</text>
      <text x="32" y="208" fill="#F1F3F9" font-size="25">3. Keep #social-approvals clean until decisions land.</text>
      <text x="32" y="254" fill="#F1F3F9" font-size="25">4. Prepare device health scan packet.</text>
    </g>

    <g transform="translate(824,250)">
      <rect width="680" height="330" rx="24" fill="#101521" stroke="#F6C86B" stroke-width="2"/>
      <text x="32" y="58" fill="#F6C86B" font-size="34" font-weight="800">Do Next</text>
      <text x="32" y="116" fill="#F1F3F9" font-size="25">1. Read-only repo risk sweep across flagship repos.</text>
      <text x="32" y="162" fill="#F1F3F9" font-size="25">2. Daily domain/deployment digest with inspect links.</text>
      <text x="32" y="208" fill="#F1F3F9" font-size="25">3. AI CoE operating-room carousel outline.</text>
      <text x="32" y="254" fill="#F1F3F9" font-size="25">4. Brand-room weekly proof rhythm.</text>
    </g>

    <g transform="translate(96,640)">
      <rect width="680" height="330" rx="24" fill="#101521" stroke="#FF7A90" stroke-width="2"/>
      <text x="32" y="58" fill="#FF7A90" font-size="34" font-weight="800">Do Not Do Yet</text>
      <text x="32" y="116" fill="#F1F3F9" font-size="25">No Hermes gateway start.</text>
      <text x="32" y="162" fill="#F1F3F9" font-size="25">No public social publishing or scheduling.</text>
      <text x="32" y="208" fill="#F1F3F9" font-size="25">No production deploys or merges.</text>
      <text x="32" y="254" fill="#F1F3F9" font-size="25">No cleanup of unrelated dirty repo state.</text>
    </g>

    <g transform="translate(824,640)">
      <rect width="680" height="330" rx="24" fill="#101521" stroke="#6EA8FE" stroke-width="2"/>
      <text x="32" y="58" fill="#6EA8FE" font-size="34" font-weight="800">Proof Required</text>
      <text x="32" y="116" fill="#F1F3F9" font-size="25">Slack link or file path for every update.</text>
      <text x="32" y="162" fill="#F1F3F9" font-size="25">Owner, channel, approval gate, stop condition.</text>
      <text x="32" y="208" fill="#F1F3F9" font-size="25">QA score for visual assets.</text>
      <text x="32" y="254" fill="#F1F3F9" font-size="25">Current-state check before claiming live automation.</text>
    </g>
  </g>

  <text x="96" y="1088" fill="#8A90A8" font-family="Inter, Arial, sans-serif" font-size="24">Operating thesis: progress is proof plus judgment. Autonomy expands only after the proof loop behaves.</text>
</svg>
